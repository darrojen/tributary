[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

# Arc networks — plain EVM, so no special EVM version needed.
rpc_endpoints = { arc_testnet = "https://rpc.testnet.arc.io", arc_mainnet = "https://rpc.mainnet.arc.io" }

[etherscan]
arc_testnet = { key = "${ARCSCAN_API_KEY}", url = "https://explorer.testnet.arc.io/api" }
arc_mainnet = { key = "${ARCSCAN_API_KEY}", url = "https://explorer.arc.io/api" }
